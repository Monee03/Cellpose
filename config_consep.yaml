logging:
  mode: offline
  project: cellvit_consep
  notes: consep_inst
  log_comment: consep
  wandb_dir: ./logs_local/wandb
  log_dir: ./logs_local
  level: Info
  log_images: false

random_seed: 19
gpu: 0
run_sweep: false
agent: null

data:
  dataset: PanNuke
  dataset_path: ./dataset_cellvitpp/consep_pannuke
  train_folds: [0]
  val_folds: [1]
  test_folds: [2]
  num_nuclei_classes: 6
  num_tissue_classes: 19
  input_shape: 256
  magnification: 40

model:
  backbone: default                 # ★ 不要写 ViT256
  embed_dim: 384
  depth: 12
  num_heads: 6
  extract_layers: [3, 6, 9, 12]
  input_channels: 3
  pretrained: ./models/pretrained/CellViT-256-x40_sd.pth   # ★ 完整权重
  regression_loss: false

loss:
  nuclei_binary_map:
    dice: {loss_fn: dice_loss, weight: 1}
    ce:   {loss_fn: xentropy_loss, weight: 1}
  hv_map:
    mse:  {loss_fn: mse_loss_maps, weight: 2.5}
    msge: {loss_fn: msge_loss_maps, weight: 8}
  nuclei_type_map:
    dice: {loss_fn: dice_loss, weight: 0.2}
    ce:   {loss_fn: xentropy_loss, weight: 0.5}

training:
  batch_size: 8
  epochs: 100
  unfreeze_epoch: 25
  drop_rate: 0
  attn_drop_rate: 0
  drop_path_rate: 0
  optimizer: AdamW
  optimizer_hyperparameter:
    betas: [0.85, 0.95]
    lr: 0.0003
    weight_decay: 0.0001
  early_stopping_patience: 20
  scheduler:
    scheduler_type: exponential
    hyperparameters: {gamma: 0.85}
  sampling_strategy: random
  sampling_gamma: 0.85
  mixed_precision: true
  eval_every: 1

transformations:
  randomrotate90: {p: 0.5}
  horizontalflip: {p: 0.5}
  verticalflip: {p: 0.5}
  colorjitter: {p: 0.2, scale_setting: 0.25, scale_color: 0.1}
  gaussnoise: {p: 0.25, var_limit: 50}
  normalize: {mean: [0.5,0.5,0.5], std: [0.5,0.5,0.5]}

eval_checkpoint: model_best.pth